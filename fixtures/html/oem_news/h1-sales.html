  <h1 class="press-title">XX汽车公布上半年销量数据，海外出口占比创新高</h1>
  <div class="press-meta">发布日期：2026.08.08 17:00　来源：XX汽车新闻中心</div>
  <div class="press-content">
    <p>XX汽车公布2026年上半年经营数据，累计销量同比实现两位数增长，海外出口占比提升至三成以上，创历史新高。</p>
    <p>分市场看，欧洲与东南亚市场增速领先，单车平均售价保持稳定，市场份额稳步提升。</p>
    <p>公司表示将继续拓展海外渠道网络，下半年出口目标有望进一步上调，同步加快本地化服务布局。</p>
