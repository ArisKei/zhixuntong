  <h1 class="news-title">二手电动车保值率分化加剧，三年残值差距接近四成</h1>
  <div class="meta">发布时间：2026-08-16 15:30　来源：新能源车资讯网　责编：孙某</div>
  <div class="article-body">
    <p>行业机构最新报告显示，二手电动车市场分化明显，头部品牌三年残值率接近七成，部分尾部品牌已跌破三成。</p>
    <p>电池衰减程度与智能配置成为影响残值的关键因素，市场集中度有望进一步提升，头部平台交易销量同步放大。</p>
    <p>报告认为，随着新车价格竞争趋缓，二手电动车市场份额将向保值率稳定的头部品牌集中，残值差距或继续维持。</p>
