  <h1 class="news-title">欧洲对部分电动汽车加征关税，出口企业评估转产</h1>
  <div class="meta">发布时间：2026-08-11 09:50　来源：新能源车资讯网　责编：周某</div>
  <div class="article-body">
    <p>欧洲对部分进口电动汽车加征关税后，出口导向车企正在评估海外工厂与本地化供应链方案，以对冲关税波动。</p>
    <p>部分企业考虑先以CKD形式过渡，再视市场情况建设完整总装线，东欧与东南亚成为热门选址。</p>
    <p>机构测算显示，关税调整将抬升整车出口成本，欧洲市场份额或向本地化生产车企转移，出口格局面临重构。</p>
