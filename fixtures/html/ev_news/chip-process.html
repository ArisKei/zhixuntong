  <h1 class="news-title">车规级芯片需求旺盛，先进制程与封装技术加速迭代</h1>
  <div class="meta">发布时间：2026-08-13 09:40　来源：新能源车资讯网　责编：吴某</div>
  <div class="article-body">
    <p>随着智能驾驶等级提升，车规级芯片算力需求快速攀升，7纳米以下先进制程产能持续紧张，晶圆代工厂订单排至明年。</p>
    <p>本土厂商在封装技术与先进封装产能上同步扩张，碳化硅功率器件上车比例提高，车规认证周期明显缩短。</p>
    <p>相关技术标准体系加快完善，产业链自主可控能力增强，芯片环节国产化率有望持续提升。</p>
